name: adoption-provenance
description: An inactive inbox is adopted once while retaining immutable original-recipient provenance.
participants:
  - id: sender
    actor: codex
    harness: fake-codex
    name_mode: exact
  - id: retired
    actor: reviewer-old
    harness: fake-claude
    name_mode: exact
  - id: replacement
    actor: reviewer-new
    harness: fake-claude
    name_mode: exact
steps:
  - action: start
    participant: sender
  - action: start
    participant: replacement
  - action: send
    from: sender
    to: retired
    body: Review this after handoff.
    type: REVIEW_REQUEST
    save_as: review
  - action: adopt
    participant: replacement
    source: retired
  - action: claim
    participant: replacement
    message: review
    save_as: review_claim
  - action: assert_original_recipient
    claim: review_claim
    source: retired
  - action: ack
    participant: replacement
    message: review
    claim: review_claim
assert:
  - every_message_acked
  - durable_inboxes_empty
  - sandbox_paths_isolated
  - orphan_processes_zero
  - socket_removed
