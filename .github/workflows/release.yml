name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: HOLLER_REQUIRE_OPENCODE_PLUGIN_TEST=1 go test ./...
      - run: go vet ./...
      - run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: holler-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Holler $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
