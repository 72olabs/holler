name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release notes match tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Fqx "# Holler ${version}" RELEASE-NOTES.md; then
            echo "RELEASE-NOTES.md does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if ! grep -Fqx "const ConnectorVersion = \"${version}\"" internal/connector/manifest.go; then
            echo "binary connector version does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          for manifest in connectors/marketplace/plugins/*/connector.json; do
            if ! jq -e --arg version "$version" '.connector_version == $version' "$manifest" >/dev/null; then
              echo "$manifest does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          done
          for plugin in \
            connectors/marketplace/plugins/holler/.codex-plugin/plugin.json \
            connectors/marketplace/plugins/claude-holler/.claude-plugin/plugin.json; do
            if ! jq -e --arg version "$version" '.version == $version' "$plugin" >/dev/null; then
              echo "$plugin does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          done
          if ! jq -e --arg version "$version" \
            '.plugins[] | select(.name == "holler") | .version == $version' \
            connectors/marketplace/.claude-plugin/marketplace.json >/dev/null; then
            echo "Claude marketplace version does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: HOLLER_REQUIRE_OPENCODE_PLUGIN_TEST=1 go test ./...
      - run: go vet ./...
      - run: HOLLER_REQUIRE_OPENCODE_PLUGIN_TEST=1 go test -race ./...
      - run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: holler-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --title "Holler $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Holler $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
