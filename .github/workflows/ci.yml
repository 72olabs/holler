name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: HOLLER_REQUIRE_OPENCODE_PLUGIN_TEST=1 go test ./...
      - run: go vet ./...
      - run: HOLLER_REQUIRE_OPENCODE_PLUGIN_TEST=1 go test -race ./...
      - run: scripts/build.sh
      - run: ./.build/holler lab run --all --timeout 20s
      - run: HOLLER_VERSION=0.0.0-ci scripts/package-release.sh
